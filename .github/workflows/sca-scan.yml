name: SCA Security Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'   # ежедневно в 3:00 UTC
  workflow_dispatch:

jobs:
  sca-scan:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Resolve dependencies
        run: |
          mvn -B -q dependency:copy-dependencies -DoutputDirectory=target/dependency
          npm ci

      - name: Get date for cache key
        id: date
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore NVD database cache
        uses: actions/cache/restore@v4
        with:
          path: ~/odc-data
          key: odc-data-${{ steps.date.outputs.date }}
          restore-keys: |
            odc-data-

      - name: Install Dependency-Check
        run: |
          V=13.0.0
          for base in dependency-check/DependencyCheck jeremylong/DependencyCheck; do
            if curl -fSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/dc.zip" "https://github.com/$base/releases/download/v$V/dependency-check-$V-release.zip"; then break; fi
          done
          ls -la "$RUNNER_TEMP/dc.zip"
          unzip -q "$RUNNER_TEMP/dc.zip" -d "$HOME/odc"

      - name: Run Dependency-Check (Quality Gate CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p report
          "$HOME/odc/dependency-check/bin/dependency-check.sh" \
            --project "sca-demo" \
            --scan . \
            -f HTML -f JSON \
            --out report \
            --data "$HOME/odc-data" \
            --disableYarnAudit \
            --disablePnpmAudit \
            --suppression dependency-check-suppression.xml \
            --failOnCVSS 7 \
            --nvdApiKey "$NVD_API_KEY" \
            --nvdApiDelay 6000 \
            --nvdMaxRetryCount 20

      - name: Save NVD database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/odc-data
          key: odc-data-${{ steps.date.outputs.date }}

      - name: Summary
        if: always()
        run: |
          if [ -f report/dependency-check-report.json ]; then
            TOTAL=$(jq '[.dependencies[].vulnerabilities[]?] | length' report/dependency-check-report.json)
            HIGH=$(jq '[.dependencies[].vulnerabilities[]? | select((.cvssv3.baseScore // 0) >= 7.0)] | length' report/dependency-check-report.json)
            {
              echo "### SCA результаты"
              echo "- Всего уязвимостей: $TOTAL"
              echo "- CVSS >= 7.0 (порог Quality Gate): $HIGH"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: report/
